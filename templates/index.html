<!DOCTYPE html>
<html>
<head>
    <title>My Diary - Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dashboard-body">
    <header class="top-nav">
        <span class="welcome-text">Welcome, {{ current_user.username }}</span>
        <a href="{{ url_for('logout') }}" class="logout-btn-red">Logout</a>
    </header>

    <div class="main-layout">
        <aside class="sidebar">
            <h3>Entries</h3>
            <button class="add-entry-btn">+ Add New Entry</button>
            <ul class="entry-list">
                {% for entry in entries %}
                <li class="entry-item">
                    <strong>{{ entry.title if entry.title else "Untitled" }}</strong>
                    <span>{{ entry.date_posted.strftime('%Y-%m-%d') }}</span>
                </li>
                {% endfor %}
            </ul>
        </aside>

        <main class="content-area">
            <h3>New Entry</h3>
            <form action="/add" method="POST" class="entry-form">
                <input type="text" name="title" placeholder="Title" class="input-title">
                <textarea name="content" placeholder="Description" class="input-desc"></textarea>
                <button type="submit" class="add-btn">Add</button>
            </form>
        </main>
    </div>
</body>
</html>
