<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Diary Book</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
    <div class="main-container">
        <div class="logo-section">
            <div class="logo-content">
                <img src="{{ url_for('static', filename='diary logo.avif') }}" alt="Diary Book Logo">
                <h1 class="brand-name">DIARY BOOK</h1>
                <p class="tagline">CAPTURING THE MOMENTS THAT MATTERS</p>
            </div>
        </div>

        <div class="form-section">
            <h2 class="login-title">Login</h2>
            <form method="POST" action="/login">
                <div class="input-group">
                    <input type="text" name="username" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="login-button">Login</button>
            </form>
            <div class="register-link">
                <a href="{{ url_for('register') }}">New user? Register here</a>
            </div>
        </div>
    </div>
</body>
</html>
